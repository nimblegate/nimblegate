# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write      # signing for build-provenance attestations
  attestations: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      # The release body is the version's CHANGELOG.md section. Written outside
      # the checkout so goreleaser does not see a dirty tree.
      - name: Release notes from CHANGELOG.md
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v v="${GITHUB_REF_NAME#v}" -f .github/release-notes.awk CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signed build provenance for the release archives and checksums.
      # Verify a download: gh attestation verify <file> --repo nimblegate/nimblegate
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

  # Only after the binaries and release page exist, so a failed release never
  # leaves an image (and a moved :latest) behind.
  container:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nimblegate/nimblegate
          # GitHub does not classify PolyForm, so the licence it reports is
          # NOASSERTION - and these generated labels are applied after the
          # Dockerfile's, overriding the correct one it sets. State it here.
          labels: |
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}-${{ steps.vars.outputs.sha_short }}
      # Signed build provenance for the image, stored with it in the registry.
      # Verify: gh attestation verify oci://ghcr.io/nimblegate/nimblegate:<version> --repo nimblegate/nimblegate
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/nimblegate/nimblegate
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
