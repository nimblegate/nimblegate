<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d">
<title id="t">How nimblegate works</title>
<desc id="d">Your computer, where you and your AI agent write code, pushes over SSH to the nimblegate gateway. The gateway checks every push against your rules. Clean pushes are forwarded byte for byte over HTTPS to your real git host (GitHub, Gitea or GitLab). Pushes that break a rule are rejected with the rule, file and line, and never reach the git host. Your computer clones and fetches from the gateway.</desc>
<rect width="1000" height="330" rx="16" fill="#ffffff"/>
<rect x="30.0" y="70" width="220" height="150" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="140" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#59636e" text-anchor="middle">YOUR COMPUTER</text>
<text x="140" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="650" fill="#1f2328" text-anchor="middle">You + your AI agent</text>
<text x="140" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">Claude Code, Cursor,</text>
<text x="140" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">Copilot, Aider...</text>
<text x="140" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#0969da" text-anchor="middle">git push</text>
<rect x="390.0" y="58" width="220" height="174" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="500" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0969da" text-anchor="middle">THE GATEWAY</text>
<text x="500" y="120" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2328" text-anchor="middle">nimblegate</text>
<text x="500" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">checks every push</text>
<text x="500" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">against your rules</text>
<rect x="420" y="180" width="160" height="26" rx="13" fill="#eef1f4" stroke="#d0d7de" stroke-width="1"/>
<text x="500" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#1f2328" text-anchor="middle">same answer, every time</text>
<rect x="750.0" y="70" width="220" height="150" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="860" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#59636e" text-anchor="middle">YOUR GIT HOST</text>
<text x="860" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="650" fill="#1f2328" text-anchor="middle">Your real repo</text>
<text x="860" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">GitHub, Gitea,</text>
<text x="860" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">GitLab...</text>
<text x="860" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1a7f37" text-anchor="middle">only clean code</text>
<line x1="256.0" y1="120" x2="384.0" y2="120" stroke="#0969da" stroke-width="2.2"/><path d="M384.0,120 l-10,-6 v12 z" fill="#0969da"/>
<text x="320.0" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#0969da" text-anchor="middle">push (SSH)</text>
<line x1="384.0" y1="170" x2="256.0" y2="170" stroke="#59636e" stroke-width="2.2" stroke-dasharray="6 5"/><path d="M256.0,170 l10,-6 v12 z" fill="#59636e"/>
<text x="320.0" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">clone, fetch</text>
<line x1="616.0" y1="145" x2="744.0" y2="145" stroke="#1a7f37" stroke-width="2.2"/><path d="M744.0,145 l-10,-6 v12 z" fill="#1a7f37"/>
<text x="680.0" y="135" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1a7f37" text-anchor="middle">clean: forwarded</text>
<text x="680.0" y="165" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">byte for byte (HTTPS)</text>
<path d="M500,232 V268 H152" fill="none" stroke="#cf222e" stroke-width="2.2"/>
<path d="M140,226 l-6,10 h12 z" fill="#cf222e"/>
<line x1="140" y1="234" x2="140" y2="268" stroke="#cf222e" stroke-width="2.2"/>
<rect x="318" y="253" width="300" height="30" rx="15" fill="#ffebe9" stroke="#cf222e" stroke-width="1.2"/>
<text x="468" y="273" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#cf222e" text-anchor="middle">rejected: rule, file and line - fix and push again</text>
<text x="860" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">never sees a rejected push</text>
</svg>